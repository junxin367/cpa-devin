[package]
name = "cpa-devin"
version = "0.1.5"
edition = "2021"
description = "CLIProxyAPI Devin per-account model discovery plugin"
license = "MIT"
repository = "https://github.com/junxin367/cpa-devin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
strip = true
